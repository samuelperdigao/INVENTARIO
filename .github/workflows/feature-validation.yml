name: Feature Validation

on:
  push:
    branches: [feat/camadas-duplicidade-lote-v2]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate frontend
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm lint
            pnpm typecheck
            pnpm test
            pnpm build
          } 2>&1 | tee frontend-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-validation-log
          path: frontend-validation.log

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      INVENTORY_DATABASE_URL: sqlite:///./inventario-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate backend
        shell: bash
        run: |
          set -o pipefail
          {
            pytest -q
            alembic upgrade head
          } 2>&1 | tee backend-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-validation-log
          path: backend/backend-validation.log
