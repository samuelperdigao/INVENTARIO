name: Integrate INVENTARIO V2

on:
  push:
    branches:
      - release/integracao-inventario-v2
    paths:
      - .github/workflows/integration-release-v2.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INVENTORY_DATABASE_URL: sqlite:///./inventario-ci.db
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: release/integracao-inventario-v2
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/camadas-duplicidade-lote-v2 feat/landing-hero-banner-redesign

      - name: Merge duplicate-lot implementation safely
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-ff --no-commit origin/feat/camadas-duplicidade-lote-v2
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "backend/app/main.py" ]; then
              echo "Unexpected conflicts:"
              echo "$conflicts"
              exit 1
            fi
            git checkout --ours backend/app/main.py
            git add backend/app/main.py
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/main.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "    JoinInventoryResponse, LoginRequest, MessageResponse, RegisterRequest, SyncRequest,\n    SyncResponse, VerifyEmailRequest,\n",
              "    JoinInventoryResponse, LoginRequest, MessageResponse, RegisterRequest, SyncEntry, SyncRequest,\n    SyncResponse, VerifyEmailRequest,\n",
              "schemas import",
          )
          replace_once(
              "    SyncFinalizedError,\n    SyncNotFoundError,\n    synchronize,\n",
              "    SyncFinalizedError,\n    SyncNotFoundError,\n    _entry_record,\n    synchronize,\n",
              "sync import",
          )
          replace_once(
              'app = FastAPI(title="Inventário — análise e sincronização", version="0.4.0", lifespan=lifespan)',
              'app = FastAPI(title="Inventário — análise e sincronização", version="0.5.0", lifespan=lifespan)',
              "api version",
          )
          replace_once(
              "        entries=(AnalysisEntry(side=entry.side, bay=entry.bay, lot=entry.lot, quantity=entry.quantity) for entry in payload.entries),\n",
              "        entries=(\n            AnalysisEntry(side=entry.side, bay=entry.bay, layer=entry.layer, lot=entry.lot, quantity=entry.quantity)\n            for entry in payload.entries\n        ),\n",
              "preview layer",
          )

          endpoint = '''\n\n@app.get("/api/v1/inventories/{inventory_id}/lots/{lot}", response_model=list[SyncEntry])\ndef inventory_lot_matches(\n    inventory_id: str,\n    lot: str,\n    exclude_entry_id: str | None = Query(default=None, alias="excludeEntryId"),\n    sync_token: str = Header(min_length=32, alias="X-Inventory-Sync-Token"),\n    user: UserRow = Depends(get_current_user),\n    session: Session = Depends(get_session),\n) -> list[dict[str, object]]:\n    if not lot.isdigit() or len(lot) > 255:\n        raise HTTPException(status_code=422, detail="O lote deve conter somente números.")\n    inventory = _inventory_access(session, inventory_id, user, sync_token, require_token=True)\n    statement = select(InventoryEntryRow).where(\n        InventoryEntryRow.inventory_id == inventory.id,\n        InventoryEntryRow.lot == lot,\n        InventoryEntryRow.tombstone.is_(False),\n    )\n    if exclude_entry_id:\n        statement = statement.where(InventoryEntryRow.id != exclude_entry_id)\n    rows = session.scalars(statement.order_by(InventoryEntryRow.created_at)).all()\n    return [_entry_record(session, row) for row in rows]\n'''
          replace_once("\n\ndef _central_report(session: Session, inventory: InventoryRow) -> dict[str, object]:", endpoint + "\n\ndef _central_report(session: Session, inventory: InventoryRow) -> dict[str, object]:", "duplicate endpoint")

          replace_once(
              "        (AnalysisEntry(side=row.side, bay=row.bay, lot=row.lot, quantity=row.quantity) for row in rows),\n    )\n\n\ndef _history_item",
              "        (\n            AnalysisEntry(side=row.side, bay=row.bay, layer=row.layer, lot=row.lot, quantity=row.quantity)\n            for row in rows\n        ),\n    )\n\n\ndef _history_item",
              "central report layer",
          )
          replace_once(
              "        (AnalysisEntry(side=row.side, bay=row.bay, lot=row.lot, quantity=row.quantity) for row in rows),\n        now,\n",
              "        (\n            AnalysisEntry(side=row.side, bay=row.bay, layer=row.layer, lot=row.lot, quantity=row.quantity)\n            for row in rows\n        ),\n        now,\n",
              "finalization layer",
          )

          path.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/feature-validation.yml
          git add -A
          git commit -m "merge: integrate duplicate lot v2"

      - name: Merge landing page safely
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-ff --no-commit origin/feat/landing-hero-banner-redesign
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "app/page.tsx" ]; then
              echo "Unexpected conflicts:"
              echo "$conflicts"
              exit 1
            fi
            git checkout --theirs app/page.tsx
            git add app/page.tsx
          fi
          git add app/landing.module.css components/landing-brand.tsx
          git commit -m "merge: integrate official landing hero"

      - name: Update integration status documentation
        shell: bash
        run: |
          if ! grep -q "Integração INVENTARIO V2" docs/STATUS.md; then
            cat >> docs/STATUS.md <<'EOF'

## Integração INVENTARIO V2 — 2026-09-12

- Consolidação executada sobre a `main` mais recente.
- Incorporadas as mudanças válidas de `feat/camadas-duplicidade-lote-v2` e `feat/landing-hero-banner-redesign`.
- Preservadas as implementações já promovidas de autenticação, compartilhamento, frontend branco/azul e polimento de motion.
- Migration adicionada: `0006_inventory_entry_layers.py`, encadeada após `0005_access_sharing`.
- Duplicidade de lote passa a preservar registros separados, autoria quando disponível, localização por lado/vão/camada e confirmação explícita.
- Relatórios continuam consolidando o mesmo lote fisicamente fragmentado.
- Landing Page remove o hero fictício antigo e passa a priorizar o banner oficial quando o asset `/public/brand/inventario-banner.png` estiver presente.
- O asset binário oficial do banner ainda não está versionado no repositório; o componente mantém fallback para não quebrar o frontend.
EOF
          fi
          git add docs/STATUS.md
          git commit -m "docs: record inventory v2 integration"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run
          pnpm build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate backend and migrations
        working-directory: backend
        run: |
          pytest -q
          alembic upgrade head

      - name: Remove temporary integration workflow and push validated result
        shell: bash
        run: |
          git rm .github/workflows/integration-release-v2.yml
          git commit -m "chore: remove temporary integration workflow"
          git push origin HEAD:release/integracao-inventario-v2
