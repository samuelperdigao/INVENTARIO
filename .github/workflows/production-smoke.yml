name: Production Smoke


on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate production surfaces and auth boundaries
        shell: bash
        run: |
          set -euo pipefail

          API="https://inventory-api-6o8h.onrender.com"
          APP="https://inventariolpe.vercel.app"

          echo "Waiting for backend..."
          for attempt in {1..24}; do
            if curl -fsS --max-time 20 "$API/healthz" | grep -q '"status":"ok"'; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Backend healthcheck failed"
              exit 1
            fi
            sleep 10
          done

          echo "Waiting for frontend..."
          for attempt in {1..24}; do
            if curl -fsS --max-time 20 "$APP/" -o /tmp/home.html; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Frontend failed"
              exit 1
            fi
            sleep 10
          done

          echo "Checking access page..."
          curl -fsS --max-time 30 "$APP/acesso" -o /tmp/access.html

          echo "Checking same-origin backend proxy..."
          curl -fsS --max-time 30 "$APP/backend-api/healthz" | grep -q '"status":"ok"'

          echo "Checking security headers..."
          curl -fsS -D /tmp/api-headers.txt -o /dev/null --max-time 30 "$API/healthz"
          grep -qi '^strict-transport-security:' /tmp/api-headers.txt
          curl -fsS -D /tmp/app-headers.txt -o /dev/null --max-time 30 "$APP/"
          grep -qi '^strict-transport-security:' /tmp/app-headers.txt

          echo "Checking eight-digit recovery NP requirement..."
          STATUS=$(curl -sS --max-time 30 -o /tmp/register.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST "$APP/backend-api/api/v1/auth/register" \
            --data '{"email":"smoke@example.com","password":"Smoke-Test-2026!Strong","passwordConfirmation":"Smoke-Test-2026!Strong","recoveryPin":"1234567","recoveryPinConfirmation":"1234567","displayName":"Smoke Test"}')
          test "$STATUS" = "422"
          jq -e '.detail | length > 0' /tmp/register.json >/dev/null

          echo "Checking unauthenticated refresh boundary..."
          STATUS=$(curl -sS --max-time 30 -o /tmp/refresh.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST "$APP/backend-api/api/v1/auth/refresh" \
            --data '{}')
          test "$STATUS" = "401"

          echo "Production smoke test passed."
